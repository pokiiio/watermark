<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <title>画像透かしツール</title>

    <!-- Bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .preview-image {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            background-color: #fff;
        }

        .section-title {
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            color: #6c757d;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <!-- ===== Header ===== -->
    <nav class="navbar navbar-expand-lg bg-primary">
        <div class="container">
            <span class="navbar-brand text-white fw-semibold">
                画像透かしツール
            </span>
        </div>
    </nav>

    <!-- ===== Main ===== -->
    <div class="container my-5">

        <div class="row g-4">

            <!-- ===== 設定パネル ===== -->
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">

                        <div class="section-title mb-3">Settings</div>

                        <div class="mb-3">
                            <label class="form-label">画像を選択</label>
                            <input type="file" id="imageInput" class="form-control" accept="image/*">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">透かし文字</label>
                            <input type="text" id="watermarkText" class="form-control" value="Sample Watermark">
                        </div>

                        <div class="mb-3">
                            <label class="form-label d-flex justify-content-between">
                                <span>文字サイズ</span>
                                <span class="text-muted">
                                    <span id="fontSizeValue">24</span> px
                                </span>
                            </label>
                            <input type="range" id="fontSize" class="form-range" min="12" max="80" value="24">
                        </div>

                        <div class="mb-4">
                            <label class="form-label d-flex justify-content-between">
                                <span>透明度</span>
                                <span class="text-muted">
                                    <span id="opacityValue">0.3</span>
                                </span>
                            </label>
                            <input type="range" id="opacity" class="form-range" min="0.05" max="1" step="0.05"
                                value="0.3">
                        </div>

                        <div class="d-grid gap-2">
                            <button id="applyBtn" class="btn btn-primary">
                                透かしを適用
                            </button>
                            <button id="downloadBtn" class="btn btn-outline-success">
                                ダウンロード
                            </button>
                        </div>

                    </div>
                </div>
            </div>

            <!-- ===== プレビュー ===== -->
            <div class="col-lg-8">
                <div class="card shadow-sm h-100">
                    <div class="card-body d-flex flex-column">

                        <div class="section-title mb-3">Preview</div>

                        <div
                            class="flex-grow-1 d-flex align-items-center justify-content-center border rounded bg-light">
                            <img id="preview" class="preview-image img-fluid" alt="preview">
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

    <script>
        const STORAGE_KEY = "watermarkSettings";

        const imageInput = document.getElementById("imageInput");
        const watermarkInput = document.getElementById("watermarkText");
        const fontSizeInput = document.getElementById("fontSize");
        const fontSizeValue = document.getElementById("fontSizeValue");
        const opacityInput = document.getElementById("opacity");
        const opacityValue = document.getElementById("opacityValue");
        const applyBtn = document.getElementById("applyBtn");
        const downloadBtn = document.getElementById("downloadBtn");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const preview = document.getElementById("preview");

        let originalImage = new Image();

        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                const s = JSON.parse(saved);
                if (s.text) watermarkInput.value = s.text;
                if (s.fontSize) fontSizeInput.value = s.fontSize;
                if (s.opacity) opacityInput.value = s.opacity;
            } catch { }
        }

        fontSizeValue.textContent = fontSizeInput.value;
        opacityValue.textContent = opacityInput.value;

        fontSizeInput.addEventListener("input", () => {
            fontSizeValue.textContent = fontSizeInput.value;
        });

        opacityInput.addEventListener("input", () => {
            opacityValue.textContent = opacityInput.value;
        });

        imageInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                originalImage.src = reader.result;
            };
            reader.readAsDataURL(file);
        });

        originalImage.onload = () => {
            canvas.width = originalImage.width;
            canvas.height = originalImage.height;
            ctx.drawImage(originalImage, 0, 0);
            preview.src = canvas.toDataURL();
        };

        applyBtn.addEventListener("click", () => {
            if (!originalImage.src) return;

            const text = watermarkInput.value;
            const fontSize = Number(fontSizeInput.value);
            const opacity = Number(opacityInput.value);

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify({ text, fontSize, opacity })
            );

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(originalImage, 0, 0);

            ctx.font = `${fontSize}px sans-serif`;
            ctx.fillStyle = `rgba(255,255,255,${opacity})`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const metrics = ctx.measureText(text);
            const hSpace = metrics.width + 40;
            const vSpace = fontSize + 40;

            ctx.rotate(-30 * Math.PI / 180);

            for (let x = -canvas.width; x < canvas.width * 2; x += hSpace) {
                for (let y = -canvas.height; y < canvas.height * 2; y += vSpace) {
                    ctx.fillText(text, x, y);
                }
            }

            ctx.rotate(30 * Math.PI / 180);
            preview.src = canvas.toDataURL();
        });

        downloadBtn.addEventListener("click", () => {
            const a = document.createElement("a");
            a.href = canvas.toDataURL("image/png");
            a.download = "watermarked.png";
            a.click();
        });
    </script>

</body>

</html>
