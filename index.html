<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <title>画像透かしツール</title>

    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-64UC4BEhTGwk3eGpak4nO2jqtl7liTS+juXkSJ2gPAQPmlClQO7s5UgCeR6US48g" crossorigin="anonymous">
</head>

<body class="bg-light">

    <div class="container py-4">
        <h1 class="mb-4">画像透かしツール</h1>

        <div class="card mb-4">
            <div class="card-body">

                <div class="mb-3">
                    <label class="form-label">画像を選択</label>
                    <input type="file" id="imageInput" class="form-control" accept="image/*">
                </div>

                <div class="mb-3">
                    <label class="form-label">透かし文字</label>
                    <input type="text" id="watermarkText" class="form-control" value="Sample Watermark">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        文字サイズ：
                        <span id="fontSizeValue">24</span> px
                    </label>
                    <input type="range" id="fontSize" class="form-range" min="12" max="80" value="24">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        透明度：
                        <span id="opacityValue">0.3</span>
                    </label>
                    <input type="range" id="opacity" class="form-range" min="0.05" max="1" step="0.05" value="0.3">
                </div>

                <div class="d-flex gap-2">
                    <button id="applyBtn" class="btn btn-primary">
                        透かしを適用
                    </button>
                    <button id="downloadBtn" class="btn btn-success">
                        ダウンロード
                    </button>
                </div>

            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">プレビュー</h5>
                <img id="preview" class="img-fluid border" alt="preview">
            </div>
        </div>
    </div>

    <!-- ★ canvas は完全に非表示 -->
    <canvas id="canvas" style="display:none;"></canvas>

    <!-- Bootstrap 5.3.8 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-jdSIJTK9l6XwXj3RixpVDXtMcA2bFd9O81RlLAwhpr2oXRqvQP88rr16IeFXTgFE"
        crossorigin="anonymous"></script>

    <script>
        const STORAGE_KEY = "watermarkSettings";

        const imageInput = document.getElementById("imageInput");
        const watermarkInput = document.getElementById("watermarkText");
        const fontSizeInput = document.getElementById("fontSize");
        const fontSizeValue = document.getElementById("fontSizeValue");
        const opacityInput = document.getElementById("opacity");
        const opacityValue = document.getElementById("opacityValue");
        const applyBtn = document.getElementById("applyBtn");
        const downloadBtn = document.getElementById("downloadBtn");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const preview = document.getElementById("preview");

        let originalImage = new Image();

        // Local Storage 読み込み
        const savedSettings = localStorage.getItem(STORAGE_KEY);
        if (savedSettings) {
            try {
                const settings = JSON.parse(savedSettings);
                if (settings.text !== undefined) watermarkInput.value = settings.text;
                if (settings.fontSize !== undefined) fontSizeInput.value = settings.fontSize;
                if (settings.opacity !== undefined) opacityInput.value = settings.opacity;
            } catch { }
        }

        fontSizeValue.textContent = fontSizeInput.value;
        opacityValue.textContent = opacityInput.value;

        fontSizeInput.addEventListener("input", () => {
            fontSizeValue.textContent = fontSizeInput.value;
        });

        opacityInput.addEventListener("input", () => {
            opacityValue.textContent = opacityInput.value;
        });

        imageInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                originalImage.src = reader.result;
            };
            reader.readAsDataURL(file);
        });

        originalImage.onload = () => {
            canvas.width = originalImage.width;
            canvas.height = originalImage.height;
            ctx.drawImage(originalImage, 0, 0);
            preview.src = canvas.toDataURL();
        };

        applyBtn.addEventListener("click", () => {
            if (!originalImage.src) return;

            const text = watermarkInput.value;
            const fontSize = Number(fontSizeInput.value);
            const opacity = Number(opacityInput.value);

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify({ text, fontSize, opacity })
            );

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(originalImage, 0, 0);

            ctx.font = `${fontSize}px sans-serif`;
            ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const textWidth = ctx.measureText(text).width;
            const horizontalSpacing = textWidth + fontSize * 2;
            const verticalSpacing = fontSize * 2;

            ctx.rotate(-30 * Math.PI / 180);

            for (let x = -canvas.width; x < canvas.width * 2; x += horizontalSpacing) {
                for (let y = -canvas.height; y < canvas.height * 2; y += verticalSpacing) {
                    ctx.fillText(text, x, y);
                }
            }

            ctx.rotate(30 * Math.PI / 180);

            preview.src = canvas.toDataURL();
        });

        downloadBtn.addEventListener("click", () => {
            const link = document.createElement("a");
            link.href = canvas.toDataURL("image/png");
            link.download = "watermarked.png";
            link.click();
        });
    </script>

</body>

</html>
